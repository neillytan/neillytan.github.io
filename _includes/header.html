<header class="site-header">
  <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
    <img src="{{ '/assets/images/sitelogo.png' | relative_url }}" alt="">
  </a>
  <nav class="site-nav">
    {%- for item in site.data.navigation -%}
      {%- if item.url == 'cv' -%}
        {%- assign href = site.cv_file | relative_url -%}
      {%- else -%}
        {%- assign href = item.url | relative_url -%}
      {%- endif -%}
      <a href="{{ href }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor -%}
  </nav>
</header>
