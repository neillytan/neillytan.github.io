- date: 2026–27
  pinned: true
  text: >-
    <span class="news-star" aria-hidden="true">☆</span>I received the Martha H. Duggan Fellowship in Caring Labor from the UW Harry Bridges Center for Labor Studies. I'm very grateful for their support of research that centers care workers’ knowledge and collective futures.
- date: 10/2026
  text: >-
    I gave a presentation about <em>Caring Labor Futures in the Home</em> on the Reclaiming the Futures of Work panel at 4S.
- date: 09/2026
  text: >-
